# 强制类型定义（来自阶段 1 提取）
enforcement_types:
  METADATA_GATE: "检查冻结字段、结构化记录、版本绑定和授权记录。"
  REPOSITORY_CHECK: "读取实际仓库、差量、工作流或 GitHub 状态后检查。"
  AUTOMATED_TEST: "依赖行为测试、故障注入、数据库或集成测试。"
  DEVICE_EVIDENCE: "依赖目标真机、实际模型或真实服务的执行证据。"
  HUMAN_REVIEW: "需要核对语义、必要性、兼容性或用户裁决。"

# 判定档位：本文件与 collaboration-gate.py 当前能覆盖到哪一档，必须逐条声明。
#   METADATA_AUTOMATED        —— 结构+冻结字段一致性，gate 可直接判定
#   METADATA_STRUCTURAL_ONLY  —— 只能核对字段/记录是否齐全，不能证明行为
#   REPO_AUTOMATED            —— 需要 git 本地状态（SHA、文件、diff），gate --mode repo 可判定
#   NEEDS_TEST                —— 必须由自动化测试/故障注入提供证据
#   NEEDS_DEVICE              —— 必须由真机/真实服务提供证据
#   NEEDS_HUMAN               —— 必须人工裁决
adjudication_levels: [METADATA_AUTOMATED, METADATA_STRUCTURAL_ONLY, REPO_AUTOMATED, NEEDS_TEST, NEEDS_DEVICE, NEEDS_HUMAN]

