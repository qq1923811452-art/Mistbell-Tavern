status_escalation_rule: "状态升级必须绑定提交 SHA 与对应证据；未执行的档位不得标记。"

# 日常轮次与最终阶段的分界（MT-011、MT-048、MT-051）
stage_policy:
  DAILY:
    default_required: [compile, unit_test, static_analysis, targeted_verification]
    forbidden_by_default: [full_apk_packaging, final_device_acceptance]
    requires_explicit_scope_to_escalate: true
  FINAL:
    required: [full_apk_provenance, real_device_acceptance_matrix, unverified_items_explicitly_marked]

