// 阿里云镜像仅作本地/国内加速；CI（海外 runner）直连官方源，避免镜像抖动导致解析失败。
// 注意：pluginManagement 必须是 settings 文件的第一个块，故环境判断在各块内内联。

pluginManagement {
    repositories {
        if (System.getenv('CI') == null) {
            maven { url "https://maven.aliyun.com/repository/google" }
            maven { url "https://maven.aliyun.com/repository/gradle-plugin" }
            maven { url "https://maven.aliyun.com/repository/public" }
        }
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        if (System.getenv('CI') == null) {
            maven { url "https://maven.aliyun.com/repository/google" }
            maven { url "https://maven.aliyun.com/repository/public" }
        }
        google()
        mavenCentral()
    }
}

rootProject.name = "MistbellTavernAndroid"
// The 2.x app module was archived at tag 2.x-final; only mistbell-v3 remains.
