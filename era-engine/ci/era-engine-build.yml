name: Era Engine APK

# 构建 era（Emuera 无头 EWP）宿主 APK。
# 上游引擎源码不在本仓库，构建时按固定提交拉取，再用 era-engine/EraHost 里
# 只增不改的工程把它编成 Android 服务包。

on:
  workflow_dispatch:
  push:
    branches:
      - "4.0幻想乡适配"
    paths:
      - "era-engine/**"
      - ".github/workflows/era-engine-build.yml"

concurrency:
  group: era-engine-${{ github.ref }}
  cancel-in-progress: true

env:
  ERA_UPSTREAM_REPO: https://github.com/KuroPeach/SkiaX-android-CI.git
  ERA_UPSTREAM_SHA: 07bc3c054fce12d5fa0464597a7bb4c4a98847f2

jobs:
  build-engine-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
          dotnet-quality: "ga"

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Fetch engine sources
        run: |
          set -e
          rm -rf era-engine/upstream
          git init era-engine/upstream
          cd era-engine/upstream
          git remote add origin "$ERA_UPSTREAM_REPO"
          git fetch --depth 1 origin "$ERA_UPSTREAM_SHA"
          git checkout -q FETCH_HEAD
          echo "engine commit: $(git rev-parse HEAD)"
          ls

      - name: Install Android workload
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          dotnet workload install android --skip-manifest-update
          dotnet --info | head -20

      - name: Publish unsigned APK
        run: |
          set -e
          dotnet publish era-engine/EraHost/EraHost.csproj \
            -c Release -f net8.0-android \
            -p:AndroidPackageFormat=apk \
            -p:AndroidKeyStore=false \
            -p:CheckEolWorkloads=false \
            -p:RunAOTCompilation=false \
            -v minimal

      - name: Locate APK
        id: apk
        run: |
          set -e
          DIR=era-engine/EraHost/bin/Release/net8.0-android
          ls -la "$DIR" || true
          APK=$(find "$DIR" -maxdepth 1 -name '*.apk' ! -name '*-Signed.apk' | head -1)
          test -n "$APK" || { echo "未找到 APK"; exit 1; }
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          echo "APK: $APK"

      - name: Sign APK
        run: |
          set -e
          APK="${{ steps.apk.outputs.path }}"
          mkdir -p out
          PASS=$(openssl rand -hex 16)
          keytool -genkeypair -v -keystore out/dev.keystore -storepass "$PASS" -keypass "$PASS" \
            -alias erahost -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Mistbell Era Host CI, OU=Build, O=Mistbell, L=-, S=-, C=-"
          BT=$(ls -d "$ANDROID_SDK_ROOT"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" sign --ks out/dev.keystore --ks-pass "pass:$PASS" \
            --key-pass "pass:$PASS" --ks-key-alias erahost \
            --out "out/mistbell-era-engine.apk" "$APK"
          "$BT/apksigner" verify --print-certs "out/mistbell-era-engine.apk"
          rm -f out/dev.keystore
          sha256sum out/mistbell-era-engine.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mistbell-era-engine-apk
          path: out/mistbell-era-engine.apk
          retention-days: 30
