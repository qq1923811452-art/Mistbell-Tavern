plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "org.jetbrains.kotlin.plugin.compose"
    id "org.jetbrains.kotlin.plugin.serialization"
    id "com.google.devtools.ksp"
    id "io.gitlab.arturbosch.detekt"
    id "org.jlleitschuh.gradle.ktlint"
}

android {
    // Optional matching Qualcomm QAIRT/LiteRT dispatch libraries for local SM8650 NPU builds.
    // Pass -PqualcommNpuLibDir=/path/to/jniLibs containing arm64-v8a dispatch and QAIRT libraries.
    def qualcommNpuLibDir = project.findProperty("qualcommNpuLibDir")
    def qualcommNpuRuntimeEnabled =
        project.hasProperty("qualcommNpuRuntime") ||
        (qualcommNpuLibDir != null && !qualcommNpuLibDir.toString().trim().isEmpty())
    if (qualcommNpuLibDir != null && !qualcommNpuLibDir.toString().trim().isEmpty()) {
        sourceSets {
            main {
                jniLibs.srcDir(file(qualcommNpuLibDir.toString()))
            }
        }
    }

    namespace "com.mistbell.tavern.android"
    compileSdk 37

    defaultConfig {
        applicationId "com.mistbell.tavern.android"
        minSdk 26
        targetSdk 37
        versionCode 14
        versionName "0.9.3-beta"
    }

    // v0.9：onnxruntime 原生库按 ABI 分包（arm64 ≈16MB / x86 等），避免单 universal APK 被
    // 无关架构拖大；universal 保留，侧载用户仍可按原方式安装
    splits {
        abi {
            enable true
            reset()
            include "arm64-v8a", "armeabi-v7a", "x86", "x86_64"
            universalApk true
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            // Debug 构建也启用资源压缩（但不混淆代码）
            shrinkResources false
            minifyEnabled false
            // 产出未签名 APK 的开关：gradlew :app:assembleDebug -PbuildUnsigned
            // （未签名包不能直接安装，需自行 apksigner 签名；用于自定义签名/分发场景）
            if (project.hasProperty('buildUnsigned')) {
                signingConfig = null
            }
        }
    }

    // 优化 APK 体积
    packagingOptions {
        if (qualcommNpuRuntimeEnabled) {
            jniLibs {
                useLegacyPackaging true
                keepDebugSymbols += ["**/libLiteRtDispatch_Qualcomm.so", "**/libQnnHtp*.so", "**/libQnnSystem.so"]
            }
        }
        resources {
            excludes += ['/META-INF/{AL2.0,LGPL2.1}']
            excludes += ['/META-INF/INDEX.LIST']
            excludes += ['/META-INF/DEPENDENCIES']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    // Room schema 导出目录（exportSchema=true 时 KSP 输出到这里，迁移测试消费）
    ksp {
        arg("room.schemaLocation", "$projectDir/schemas")
        arg("room.incremental", "true")
    }

    buildFeatures {
        compose true
        buildConfig true
    }
}

dependencies {
    // Compose BOM
    def composeBom = platform('androidx.compose:compose-bom:2026.09.00')
    implementation composeBom

    // Compose UI
    implementation "androidx.compose.ui:ui"
    implementation "androidx.compose.ui:ui-graphics"
    implementation "androidx.compose.ui:ui-tooling-preview"
    debugImplementation "androidx.compose.ui:ui-tooling"

    // Material 3
    implementation "androidx.compose.material3:material3"
    implementation "androidx.compose.material3:material3-window-size-class"
    implementation "androidx.compose.material:material-icons-extended"

    // Activity & Lifecycle
    implementation "androidx.activity:activity-compose:1.13.0"
    implementation "androidx.lifecycle:lifecycle-viewmodel-compose:2.11.0"
    implementation "androidx.lifecycle:lifecycle-runtime-compose:2.11.0"

    // Navigation
    implementation "androidx.navigation:navigation-compose:2.10.2"

    // Networking
    implementation "com.squareup.retrofit2:retrofit:3.0.0"
    implementation "com.squareup.retrofit2:converter-kotlinx-serialization:3.0.0"
    implementation "com.squareup.okhttp3:okhttp:5.3.0"
    // F1: SSE 真流式支持
    implementation "com.squareup.okhttp3:okhttp-sse:5.3.0"
    implementation "com.squareup.okhttp3:logging-interceptor:5.3.0"
    implementation "org.jetbrains.kotlinx:kotlinx-serialization-json:1.10.0"

    // Image loading
    implementation "io.coil-kt:coil-compose:2.7.0"

    // ExifInterface for image rotation
    implementation "androidx.exifinterface:exifinterface:1.4.2"

    // Core
    implementation "androidx.core:core-ktx:1.19.1"

    // Room
    def roomVersion = '2.8.5'
    implementation "androidx.room:room-runtime:$roomVersion"
    implementation "androidx.room:room-ktx:$roomVersion"
    ksp "androidx.room:room-compiler:$roomVersion"

    // DataStore
    implementation "androidx.datastore:datastore-preferences:1.2.1"

    // Coroutines
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.11.0"

    // F3 本地语义向量：保留 ONNX BGE 作为轻量方案，并增加 LiteRT-LM EmbeddingGemma 2。
    implementation "com.microsoft.onnxruntime:onnxruntime-android:1.17.3"
    implementation "com.google.ai.edge.litertlm:litertlm-android:0.18.0"

    // 单元测试（本地 JVM）
    testImplementation "junit:junit:4.13.2"

    // Room 迁移测试（instrumented）
    androidTestImplementation "androidx.room:room-testing:$roomVersion"
    androidTestImplementation "androidx.test:runner:1.6.2"
    androidTestImplementation "androidx.test.ext:junit:1.2.1"
    androidTestImplementation "androidx.test:core:1.6.1"
}

// ---- F0 质量门配置（见 docs/FOUNDATION.md）----

detekt {
    buildUponDefaultConfig = true
    allRules = false
    // 基线吸收存量告警，新代码零容忍；基线文件入库，随修复逐步清空
    baseline = file("$rootDir/config/detekt/baseline.xml")
    reports {
        html { required.set(true) }
        xml { required.set(false) }
        txt { required.set(false) }
        sarif { required.set(false) }
    }
}

ktlint {
    android.set(true)
    verbose.set(true)
    outputToConsole.set(true)
    // Apply the repository's checked-in baseline for existing style debt; new violations still fail CI.
    baseline = file("$projectDir/config/ktlint/baseline.xml")
}
