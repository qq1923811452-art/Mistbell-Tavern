name: Qualcomm HTP V75 Runtime Package

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "mistbell-v3/**"
      - ".github/scripts/package-litertlm-qualcomm-runtime.sh"
      - ".github/workflows/qualcomm-npu-runtime.yml"

permissions:
  contents: read

concurrency:
  group: qualcomm-npu-runtime-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  package-sm8650-runtime:
    name: Build and package SM8650 HTP V75 dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout Mistbell source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Checkout the pinned LiteRT-LM source
        uses: actions/checkout@v4
        with:
          repository: google-ai-edge/LiteRT-LM
          ref: v0.18.0
          path: upstream/litert-lm
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify preinstalled Android SDK
        shell: bash
        run: |
          set -euo pipefail
          test -n "${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          test -x "${ANDROID_SDK_ROOT:-$ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" || find "${ANDROID_SDK_ROOT:-$ANDROID_HOME}/cmdline-tools" -type f -name sdkmanager -print -quit | grep -q sdkmanager

      - name: Install pinned Android NDK
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager_path="$(find "${ANDROID_SDK_ROOT:-$ANDROID_HOME}/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -n "$sdkmanager_path"
          "$sdkmanager_path" "ndk;28.1.13356709"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/28.1.13356709" >> "$GITHUB_ENV"
          test -f "$ANDROID_SDK_ROOT/ndk/28.1.13356709/README.md"

      - name: Set up Bazelisk
        uses: bazelbuild/setup-bazelisk@v3

      - name: Record exact source and SDK provenance
        shell: bash
        run: |
          set -euo pipefail
          echo "Mistbell source: $(git rev-parse HEAD)"
          echo "LiteRT-LM source: $(git -C upstream/litert-lm rev-parse HEAD)"
          echo "LiteRT-LM tag: v0.18.0"
          echo "Android NDK: 28.1.13356709 (r28b)"

      - name: Build the Qualcomm Dispatch plugin from the pinned LiteRT-LM tree
        working-directory: upstream/litert-lm
        shell: bash
        run: |
          set -euo pipefail
          bazel build --config=android_arm64 @litert//litert/vendors/qualcomm/dispatch:dispatch_api_so

      - name: Locate the exact QAIRT SDK and Dispatch build outputs
        id: runtime
        shell: bash
        working-directory: upstream/litert-lm
        run: |
          set -euo pipefail
          dispatch="$(find -L bazel-bin bazel-out -type f -name 'libLiteRtDispatch_Qualcomm.so' -print -quit 2>/dev/null || true)"
          if [[ -z "$dispatch" ]]; then
            dispatch="$(find -L . -type f -name 'libLiteRtDispatch_Qualcomm.so' -print -quit)"
          fi
          test -n "$dispatch" && test -s "$dispatch"

          qnn_system="$(find -L . -type f -path '*/lib/aarch64-android/libQnnSystem.so' -print -quit)"
          test -n "$qnn_system" && test -s "$qnn_system"
          qairt_root="${qnn_system%/lib/aarch64-android/libQnnSystem.so}"
          test -s "$qairt_root/lib/aarch64-android/libQnnHtp.so"
          test -s "$qairt_root/lib/aarch64-android/libQnnHtpPrepare.so"
          test -s "$qairt_root/lib/hexagon-v75/unsigned/libQnnHtpV75Skel.so"

          qairt_workspace="$(find -L . -type f -path '*/third_party/qairt/workspace.bzl' -print -quit || true)"
          if [[ -z "$qairt_workspace" ]]; then
            echo "Cannot locate the pinned QAIRT workspace declaration in the v0.18.0 LiteRT-LM dependency tree." >&2
            exit 1
          fi
          qairt_version="$(grep -oE 'strip_prefix = "qairt/[^"]+"' "$qairt_workspace" | head -n 1 | cut -d/ -f2 | tr -d '" ')"
          test -n "$qairt_version" || { echo "Cannot parse the QAIRT version pinned by upstream." >&2; exit 1; }
          echo "qairt_root=$PWD/${qairt_root#./}" >> "$GITHUB_OUTPUT"
          echo "dispatch_so=$PWD/${dispatch#./}" >> "$GITHUB_OUTPUT"
          echo "qairt_version=$qairt_version" >> "$GITHUB_OUTPUT"
          echo "QAIRT root found: $qairt_root (pinned version $qairt_version)"
          echo "Dispatch plugin found: $dispatch"
          sha256sum "$qnn_system" "$dispatch"

      # Keep GPU available for portable-model fallback in the same device-test APK.
      # The Qualcomm model itself remains NPU-only; this packages both runtime families
      # without changing the model/backend safety policy.
      - name: Package pinned LiteRT-LM GPU runtime
        shell: bash
        run: bash .github/scripts/package-litertlm-gpu-runtime.sh

      - name: Stage the Qualcomm HTP V75 runtime into the Android project
        shell: bash
        env:
          QUALCOMM_QAIRT_ROOT: ${{ steps.runtime.outputs.qairt_root }}
          QUALCOMM_QAIRT_VERSION: ${{ steps.runtime.outputs.qairt_version }}
          LITERT_QUALCOMM_DISPATCH_SO: ${{ steps.runtime.outputs.dispatch_so }}
        run: |
          set -euo pipefail
          bash .github/scripts/package-litertlm-qualcomm-runtime.sh

      - name: Build arm64 APK with Qualcomm runtime payload
        shell: bash
        env:
          # Gradle's packageQualcommNpuRuntime Exec task runs in a separate process;
          # pass the SDK locations into this step too, not only the earlier staging step.
          QUALCOMM_QAIRT_ROOT: ${{ steps.runtime.outputs.qairt_root }}
          QUALCOMM_QAIRT_VERSION: ${{ steps.runtime.outputs.qairt_version }}
          LITERT_QUALCOMM_DISPATCH_SO: ${{ steps.runtime.outputs.dispatch_so }}
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew -p mistbell-v3 :app:assembleDebug -PenableQualcommNpuRuntime=true --no-daemon --no-parallel

      - name: Audit native library dependencies in the final APK
        shell: bash
        run: |
          set -euo pipefail
          apk="$(find mistbell-v3/app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "$apk" && test -s "$apk"
          audit_dir="$RUNNER_TEMP/qualcomm-apk-native-audit"
          mkdir -p "$audit_dir"
          unzip -q "$apk" 'lib/arm64-v8a/*.so' -d "$audit_dir"
          extracted="$audit_dir/lib/arm64-v8a"
          host_libs="$audit_dir/host-arm64"
          dsp_dir="$audit_dir/hexagon-v75"
          mkdir -p "$host_libs" "$dsp_dir"
          shopt -s nullglob
          # DSP skeletons are Qualcomm Hexagon payloads, so they belong in APK
          # assets rather than Android's arm64-v8a JNI library directory.
          dsp_entries="$(unzip -Z1 "$apk" | grep -E '^assets/native-runtime/hexagon-v75/libQnnHtpV75.*Skel\.so' || true)"
          test -n "$dsp_entries" || { echo "No Qualcomm HTP V75 DSP skeleton found in APK assets." >&2; exit 1; }
          while IFS= read -r entry; do
            name="${entry##*/}"
            unzip -p "$apk" "$entry" > "$dsp_dir/$name"
            test -s "$dsp_dir/$name"
          done <<< "$dsp_entries"
          for library in "$extracted"/*.so; do cp "$library" "$host_libs/"; done
          bash .github/scripts/audit-native-libraries.sh "$host_libs"
          for skeleton in "$dsp_dir"/*.so; do
            readelf -h "$skeleton" | grep -Eq "Machine:[[:space:]]*QUALCOMM DSP6 Processor" || {
              echo "Expected a Qualcomm DSP6/V75 skeleton, got an unexpected ELF architecture: $skeleton" >&2
              exit 1
            }
            echo "Verified Qualcomm DSP skeleton architecture: $(basename "$skeleton")"
          done

      - name: Verify APK contains the staged runtime and record hashes
        shell: bash
        run: |
          set -euo pipefail
          apk="$(find mistbell-v3/app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "$apk" && test -s "$apk"
          mkdir -p build-artifacts
          cp "$apk" build-artifacts/
          unzip -Z1 "$apk" > build-artifacts/apk-entries.txt
          inventory="mistbell-v3/app/src/main/assets/native-runtime/qualcomm-sm8650-inventory.txt"
          test -s "$inventory"
          mapfile -t inventory_lines < "$inventory"
          [[ "${#inventory_lines[@]}" -gt 0 ]] || { echo "Qualcomm runtime inventory is empty." >&2; exit 1; }
          for line in "${inventory_lines[@]}"; do
            read -r library size extra <<< "$line"
            [[ -n "${library:-}" && "${size:-}" =~ ^[0-9]+$ && -z "${extra:-}" ]] || {
              echo "Malformed Qualcomm runtime inventory row." >&2
              exit 1
            }
            if [[ "$library" =~ ^[A-Za-z0-9._+-]+\.so$ ]]; then
              archive_path="lib/arm64-v8a/$library"
            elif [[ "$library" =~ ^hexagon-v75/[A-Za-z0-9._+-]+\.so$ ]]; then
              # Hexagon DSP skeletons are assets, not Android arm64 JNI libraries.
              archive_path="assets/native-runtime/$library"
            else
              echo "Malformed Qualcomm runtime inventory path: $library" >&2
              exit 1
            fi
            grep -Fxq "$archive_path" build-artifacts/apk-entries.txt || {
              echo "APK is missing staged runtime payload: $archive_path" >&2
              exit 1
            }
            actual_size="$(unzip -p "$apk" "$archive_path" | wc -c | tr -d '[:space:]')"
            [[ "$actual_size" == "$size" ]] || {
              echo "Packaged runtime size mismatch for $archive_path: expected $size, got $actual_size." >&2
              exit 1
            }
          done

          # Verify the GPU plugins are present and byte-for-byte match the pinned upstream
          # prebuilt manifest, so the device APK cannot silently regress to CPU-only packaging.
          gpu_checksums="$RUNNER_TEMP/litertlm-gpu.sha256"
          unzip -p "$apk" assets/native-runtime/litertlm-gpu.sha256 > "$gpu_checksums"
          test -s "$gpu_checksums"
          mapfile -t gpu_checksum_lines < "$gpu_checksums"
          [[ "${#gpu_checksum_lines[@]}" -eq 7 ]] || {
            echo "Expected exactly 7 GPU checksum rows; found ${#gpu_checksum_lines[@]}." >&2
            exit 1
          }
          gpu_count=0
          for line in "${gpu_checksum_lines[@]}"; do
            read -r expected name extra <<< "$line"
            [[ -n "${expected:-}" && -n "${name:-}" && -z "${extra:-}" ]] || {
              echo "Malformed GPU checksum row." >&2
              exit 1
            }
            [[ "$expected" =~ ^[0-9a-fA-F]{64}$ ]] || { echo "Malformed SHA-256 for $name." >&2; exit 1; }
            [[ "$name" =~ ^[A-Za-z0-9._+-]+\.so$ ]] || { echo "Malformed GPU library name: $name" >&2; exit 1; }
            actual="$(unzip -p "$apk" "lib/arm64-v8a/$name" | sha256sum | awk '{print $1}')"
            [[ "$actual" == "$expected" ]] || {
              echo "Packaged GPU runtime hash mismatch for $name" >&2
              exit 1
            }
            gpu_count=$((gpu_count + 1))
          done
          echo "Verified all $gpu_count pinned LiteRT-LM GPU library hashes inside the device APK."

          (cd build-artifacts && sha256sum *.apk | tee SHA256SUMS.txt)
          {
            echo "mistbell_source_sha=$(git rev-parse HEAD)"
            echo "litert_lm_tag=v0.18.0"
            echo "litert_lm_sha=$(git -C upstream/litert-lm rev-parse HEAD)"
            echo "android_ndk=28.1.13356709"
            echo "runtime_status=packaged_not_device_verified"
            echo "npu_status=packaged_not_device_verified"
            echo "npu_evidence_policy=runtime-generated-json-must-match-current-apk"
          } > build-artifacts/SOURCE.txt
      - name: Upload SM8650 device-test APK and provenance
        uses: actions/upload-artifact@v4
        with:
          name: mistbell-sm8650-htp-v75-device-test-${{ github.run_number }}
          path: |
            build-artifacts/*.apk
            build-artifacts/SHA256SUMS.txt
            build-artifacts/SOURCE.txt
            build-artifacts/apk-entries.txt
            mistbell-v3/app/src/main/assets/native-runtime/qualcomm-sm8650.properties
            mistbell-v3/app/src/main/assets/native-runtime/qualcomm-sm8650.sha256
            mistbell-v3/app/src/main/assets/native-runtime/qualcomm-sm8650-inventory.txt
            mistbell-v3/app/src/main/assets/native-runtime/litertlm-gpu.properties
            mistbell-v3/app/src/main/assets/native-runtime/litertlm-gpu.sha256
            mistbell-v3/app/src/main/assets/native-runtime/litertlm-gpu-inventory.txt
            mistbell-v3/app/src/main/assets/native-runtime/LITERT_LM_LICENSE.txt
          if-no-files-found: error
          retention-days: 7
