name: One-time Kotlin formatting repair
# Trigger formatter after workflow becomes available on the default branch

on:
  push:
    branches:
      - fix/format-kotlin-source
    paths:
      - "app/**"
      - "gradle/**"
      - ".github/workflows/format-source-once.yml"

permissions:
  contents: write

jobs:
  format-and-commit:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Run ktlint formatter
        run: |
          chmod +x ./gradlew
          ./gradlew :app:ktlintFormat --no-daemon --no-parallel
      - name: Commit formatted source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src
          if git diff --cached --quiet; then
            echo "No formatting changes were needed."
          else
            git commit -m "style: apply ktlint formatting [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          fi
