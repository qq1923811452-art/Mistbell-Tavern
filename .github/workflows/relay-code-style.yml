name: AI Relay Code Style

on:
  # Manual only: do not let every push trigger an external-model source-editing workflow.
  workflow_dispatch:
    inputs:
      scope:
        description: "Scope of AI-assisted code cleanup"
        required: true
        type: choice
        options:
          - recent-kotlin-changes
        default: recent-kotlin-changes

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: relay-code-style-feature
  cancel-in-progress: false

jobs:
  reject-wrong-branch:
    name: Explain required target branch
    if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/feature'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Require the feature branch
        shell: bash
        run: |
          echo "::error::This workflow only writes to feature. Select the feature branch in Run workflow."
          exit 1

  standardize:
    if: github.ref == 'refs/heads/feature'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature
          fetch-depth: 30
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make wrapper executable
        run: chmod +x ./gradlew

      - name: Validate relay configuration
        env:
          ODYS_API_KEY: ${{ secrets.ODYS_API_KEY }}
          ODYS_MODEL: ${{ secrets.ODYS_MODEL }}
        run: |
          test -n "$ODYS_API_KEY" || { echo "::error::Missing repository secret ODYS_API_KEY"; exit 1; }
          test -n "$ODYS_MODEL" || { echo "::error::Missing repository secret ODYS_MODEL"; exit 1; }

      # Deliberately do not run ktlintFormat here: it can rewrite unrelated Kotlin files.
      # Collect diagnostics first and only apply the explicitly validated AI patch.

      - name: Collect diagnostics and recent Kotlin changes
        id: context
        shell: bash
        run: |
          set +e
          ./gradlew :app:detekt :app:ktlintCheck --continue --no-daemon --no-configuration-cache > /tmp/style-check.log 2>&1
          CHECK_EXIT=$?
          set -e
          git log -p -n 10 -- '*.kt' > /tmp/recent-kotlin.diff || true
          git diff HEAD -- '*.kt' > /tmp/working-kotlin.diff || true
          CHECK_EXIT="$CHECK_EXIT" python3 - <<'PY'
          from pathlib import Path
          import json, os
          log = Path("/tmp/style-check.log").read_text(errors="replace")
          recent_diff = Path("/tmp/recent-kotlin.diff").read_text(errors="replace")
          working_diff = Path("/tmp/working-kotlin.diff").read_text(errors="replace")
          exit_code = int(os.environ["CHECK_EXIT"])
          context = {
              "branch": "feature",
              "checks_exit_code": exit_code,
              "diagnostics": log[-24000:],
              "recent_kotlin_diff": recent_diff[-12000:],
              "working_tree_format_diff": working_diff[-24000:],
          }
          Path("/tmp/relay-context.json").write_text(json.dumps(context, ensure_ascii=False))
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write("needs_ai=" + ("true" if exit_code != 0 else "false") + "\n")
          print("Captured complete checker output plus recent and formatter-produced Kotlin diffs.")
          print("AI patch required:", "yes" if exit_code != 0 else "no")
          PY

      - name: Ask relay AI for a minimal style-only patch
        if: steps.context.outputs.needs_ai == 'true'
        id: ai
        env:
          ODYS_API_KEY: ${{ secrets.ODYS_API_KEY }}
          ODYS_MODEL: ${{ secrets.ODYS_MODEL }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error
          context = open("/tmp/relay-context.json", encoding="utf-8").read()
          prompt = """你是这个 Kotlin Android 仓库的资深维护者。请根据下面的真实 Detekt/Ktlint 诊断和近期 Kotlin diff，生成最小、可验证的代码规范修复补丁。
          硬性规则：
          1. 只输出标准 unified diff（以 diff --git 开始），不要 Markdown 代码围栏或解释。优先修复诊断日志中所有明确、可安全修复的问题；补丁最多修改 8 个 Kotlin 文件，只改与实际诊断直接相关的行。若诊断无法在安全范围内一次修复，宁可输出空补丁。
          2. 只做格式、超长方法的合理拆分、参数对象整理等与诊断直接相关的改动；不得改变产品行为、API 协议、Room schema/migration、streaming include_usage、usage 缺失时显示规则、thinking 开关语义或资源释放行为。
          3. 不要关闭/放宽 Detekt、Ktlint，不要添加 suppress，不要改 baseline，不要改测试来掩盖问题。
          4. 补丁必须匹配给出的当前 diff；不确定时输出空补丁，不要臆造上下文。禁止输出 index 行或虚构 blob hash；每个 hunk 的上下文与行数必须完整，必须以完整 hunk 结束，不得截断。
          5. 优先处理新增/修改代码中的诊断。保持 Kotlin 风格，避免只为缩短行而制造难读代码。只改动能够从上下文确定且与诊断直接相关的问题；每个补丁必须完整且可由 git apply --check 校验。最多输出八个 diff --git 文件段，且每个文件都必须是 Kotlin 源码。
          以下是 JSON 格式的诊断和近期改动：
          """ + context
          payload = {
              "model": os.environ["ODYS_MODEL"],
              "messages": [
                  {"role": "system", "content": "You produce safe, minimal unified diffs for Kotlin style fixes. Never expose secrets."},
                  {"role": "user", "content": prompt}
              ],
              "stream": False,
              "temperature": 0.1
          }
          req = urllib.request.Request(
              "https://api.odys.work/v1/chat/completions",
              data=json.dumps(payload).encode("utf-8"),
              headers={"Authorization": "Bearer " + os.environ["ODYS_API_KEY"],
                       "Content-Type": "application/json"},
              method="POST")
          try:
              with urllib.request.urlopen(req, timeout=180) as response:
                  data = json.loads(response.read().decode("utf-8"))
          except urllib.error.HTTPError as exc:
              print("Relay request failed with HTTP", exc.code)
              raise SystemExit(1)
          except Exception as exc:
              print("Relay request failed:", type(exc).__name__)
              raise SystemExit(1)
          choices = data.get("choices") or []
          if not choices:
              raise SystemExit("Relay returned no choices")
          content = choices[0].get("message", {}).get("content", "")
          if not isinstance(content, str):
              raise SystemExit("Relay response content was not text")
          # Accept only a unified diff; reject prose or unsupported output.
          start = content.find("diff --git ")
          patch = content[start:] if start >= 0 else ""
          if patch and ("*** Begin Patch" in patch or "\x00" in patch):
              raise SystemExit("Relay returned a non-git or invalid patch format")
          # Fail closed on malformed hunk counts; do not repair a model-generated patch.
          patch = patch.rstrip() + "\n" if patch.strip() else ""
          open("/tmp/relay-style.patch", "w", encoding="utf-8").write(patch)
          print("Relay model:", data.get("model", os.environ["ODYS_MODEL"]))
          print("Patch generated:", "yes" if patch.strip() else "no")
          PY

      - name: Validate and apply AI patch
        if: steps.context.outputs.needs_ai == 'true'
        id: patch
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -s /tmp/relay-style.patch ]; then
            echo "The relay returned no applicable patch; refusing to invent changes."
            exit 1
          fi
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess, sys
          patch = Path("/tmp/relay-style.patch").read_text(encoding="utf-8")
          sections = re.findall(r"^diff --git a/(.+) b/(.+)$", patch, re.MULTILINE)
          if not sections or len(sections) > 8:
              sys.exit("Refusing patch: expected 1-8 Kotlin file sections")
          paths = []
          for old_path, new_path in sections:
              if old_path != new_path:
                  sys.exit("Refusing patch: renames are not allowed")
              p = Path(new_path)
              if (not new_path.endswith(".kt") or p.is_absolute()
                      or ".." in p.parts or new_path.startswith("/")):
                  sys.exit("Refusing patch: only repository-relative Kotlin files are allowed")
              if subprocess.run(["git", "ls-files", "--error-unmatch", "--", new_path],
                                stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL).returncode != 0:
                  sys.exit("Refusing patch: file must already be tracked")
              paths.append(new_path)
          if len(set(paths)) != len(paths):
              sys.exit("Refusing patch: duplicate file sections")
          old_headers = re.findall(r"^--- a/(.+)$", patch, re.MULTILINE)
          new_headers = re.findall(r"^\+\+\+ b/(.+)$", patch, re.MULTILINE)
          if old_headers != [old for old, _ in sections] or new_headers != [new for _, new in sections]:
              sys.exit("Refusing patch: file headers do not match the validated diff sections")
          forbidden = ("new file mode ", "deleted file mode ", "old mode ", "new mode ",
                       "rename from ", "rename to ", "GIT binary patch", "Binary files ")
          if any(marker in patch for marker in forbidden) or "--- /dev/null" in patch or "+++ /dev/null" in patch:
              sys.exit("Refusing patch: file creation, deletion, rename, mode changes, and binary edits are forbidden")
          Path("/tmp/relay-style-paths.txt").write_text("".join(p + "\n" for p in paths), encoding="utf-8")
          print("Validated tracked Kotlin-only patch paths:", ", ".join(paths))
          PY
          git apply --check /tmp/relay-style.patch
          git apply /tmp/relay-style.patch
          git diff --check
          git diff --stat

      - name: Run complete quality gate
        run: ./gradlew checkAll --continue --no-daemon --no-configuration-cache

      - name: Commit verified AI cleanup to an isolated branch and open a PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ ! -s /tmp/relay-style-paths.txt ]; then
            echo "::error::Validated patch path list is missing; refusing to stage files."
            exit 1
          fi
          git add --pathspec-from-file=/tmp/relay-style-paths.txt
          git commit -m "Apply verified Kotlin style cleanup"
          BRANCH="automation/relay-style-${GITHUB_RUN_ID}"
          git push origin "HEAD:refs/heads/${BRANCH}"
          set +e
          PR_OUTPUT="$(gh pr create \
            --base feature \
            --head "${BRANCH}" \
            --title "style: apply verified relay Kotlin fixes" \
            --body "Automated Kotlin style patch proposed by the configured AI relay. The workflow ran ./gradlew checkAll before creating this PR. Review the diff before merging." 2>&1)"
          PR_EXIT=$?
          set -e
          if [ "$PR_EXIT" -ne 0 ]; then
            printf '%s\n' "$PR_OUTPUT"
            if [[ "$PR_OUTPUT" == *"GitHub Actions is not permitted to create or approve pull requests"* ]]; then
              PR_URL="https://github.com/${GITHUB_REPOSITORY}/pull/new/${BRANCH}"
              echo "::warning::Verified changes were pushed, but the repository blocks pull-request creation from GitHub Actions."
              {
                echo "### Manual pull request creation required"
                echo
                echo "The Kotlin style changes passed the full checkAll gate and were pushed to $BRANCH."
                echo
                echo "[Open the pull request form]($PR_URL)"
                echo
                echo "For automatic PR creation, enable **Allow GitHub Actions to create and approve pull requests** in repository Settings → Actions → General."
              } >> "$GITHUB_STEP_SUMMARY"
            else
              exit "$PR_EXIT"
            fi
          fi

      - name: Upload patch and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relay-ai-code-style-report
          path: |
            /tmp/relay-style.patch
            /tmp/relay-context.json
            /tmp/style-check.log
          if-no-files-found: ignore
          retention-days: 14
