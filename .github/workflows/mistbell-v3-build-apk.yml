name: Mistbell 3.0 Final Device-Test APK

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mistbell-v3-final-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-verified-apk:
    # This workflow is triggered manually from GitHub Actions (workflow_dispatch).
    # It always compiles and tests the checked-out source before packaging the APK.
    if: ${{ github.event_name == 'workflow_dispatch' }}
    name: Verify 3.0 source, then package debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact source commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # LiteRT-LM 0.18.0's Android AAR does not include the separate GPU
      # accelerator plugins. Fetch matching upstream prebuilts at the exact
      # release tag and package them into the APK's arm64 native-library dir.
      - name: Package matching LiteRT-LM GPU native libraries
        shell: bash
        run: |
          set -euo pipefail
          upstream_dir="$RUNNER_TEMP/LiteRT-LM"
          git clone --depth 1 --branch v0.18.0 https://github.com/google-ai-edge/LiteRT-LM.git "$upstream_dir"
          test "$(git -C "$upstream_dir" describe --tags --exact-match)" = "v0.18.0"
          test "$(git -C "$upstream_dir" rev-parse HEAD)" = "b2f686e2ed4718fb84ec398a61dd59ca0f0aff27"
          source_dir="$upstream_dir/prebuilt/android_arm64"
          destination="mistbell-v3/app/src/main/jniLibs/arm64-v8a"
          test -d "$source_dir"
          mkdir -p "$destination" mistbell-v3/app/src/main/assets/native-runtime
          shopt -s nullglob
          libraries=("$source_dir"/*.so)
          test "${#libraries[@]}" -gt 0
          for library in "${libraries[@]}"; do
            test -s "$library"
            install -m 0644 "$library" "$destination/"
          done
          test -s "$destination/libLiteRtGpuAccelerator.so"
          test -s "$destination/libLiteRtOpenClAccelerator.so"
          install -m 0644 "$upstream_dir/LICENSE" \
            mistbell-v3/app/src/main/assets/native-runtime/LITERT_LM_LICENSE.txt
          printf 'source_url=https://github.com/google-ai-edge/LiteRT-LM\n' > mistbell-v3/app/src/main/assets/native-runtime/litertlm-gpu.properties
          printf 'source_tag=v0.18.0\n' > mistbell-v3/app/src/main/assets/native-runtime/litertlm-gpu.properties
          printf 'source_commit=b2f686e2ed4718fb84ec398a61dd59ca0f0aff27\n' >> mistbell-v3/app/src/main/assets/native-runtime/litertlm-gpu.properties
          printf 'source_directory=prebuilt/android_arm64\n' >> mistbell-v3/app/src/main/assets/native-runtime/litertlm-gpu.properties
          printf 'validation_state=packaged_not_device_verified\n' >> mistbell-v3/app/src/main/assets/native-runtime/litertlm-gpu.properties
          printf 'packaged_libraries=%s\n' "${#libraries[@]}" >> mistbell-v3/app/src/main/assets/native-runtime/litertlm-gpu.properties
          sha256sum "${libraries[@]}" > mistbell-v3/app/src/main/assets/native-runtime/litertlm-gpu.sha256
          : > mistbell-v3/app/src/main/assets/native-runtime/litertlm-gpu-inventory.txt
          for library in "${libraries[@]}"; do
            printf '%s\t%s bytes\n' "$(basename "$library")" "$(stat -c '%s' "$library")" >> mistbell-v3/app/src/main/assets/native-runtime/litertlm-gpu-inventory.txt
          done
          echo "Packaged ${#libraries[@]} LiteRT-LM arm64 native libraries."

      - name: Ensure root Gradle wrapper is executable
        run: chmod +x ./gradlew

      - name: Compile and run unit tests before packaging
        run: ./gradlew -p mistbell-v3 :app:compileDebugKotlin :app:testDebugUnitTest --no-daemon --no-parallel

      - name: Package final debug APK only after tests pass
        run: ./gradlew -p mistbell-v3 :app:assembleDebug --no-daemon --no-parallel

      - name: Audit native libraries merged into final APK
        shell: bash
        run: |
          set -euo pipefail
          apk="$(find mistbell-v3/app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "$apk"
          audit_dir="$RUNNER_TEMP/apk-native-audit"
          mkdir -p "$audit_dir"
          unzip -q "$apk" 'lib/arm64-v8a/*.so' -d "$audit_dir"
          chmod +x .github/scripts/audit-native-libraries.sh
          .github/scripts/audit-native-libraries.sh "$audit_dir/lib/arm64-v8a"

      - name: Generate APK checksum and source provenance
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build-artifacts
          find mistbell-v3/app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' -exec cp {} build-artifacts/ \;
          test -n "$(find build-artifacts -maxdepth 1 -type f -name '*.apk' -print -quit)"
          cd build-artifacts
          sha256sum *.apk | tee SHA256SUMS.txt
          printf 'source_sha=%s\nworkflow_run_id=%s\nartifact_role=3.0-device-test-debug-apk\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" > SOURCE.txt

      - name: Upload final device-test APK and provenance
        uses: actions/upload-artifact@v4
        with:
          name: mistbell-v3-device-test-apk-${{ github.run_number }}
          path: build-artifacts/*
          if-no-files-found: error
          retention-days: 14