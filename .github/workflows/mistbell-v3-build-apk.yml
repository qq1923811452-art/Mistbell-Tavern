name: Mistbell 3.0 Final Device-Test APK

on:
  workflow_dispatch:
  push:
    branches:
      - codex/mistbell-3.0-core-features
    paths:
      - "mistbell-v3/**"
      - ".github/workflows/mistbell-v3-build-apk.yml"

permissions:
  contents: read

concurrency:
  group: mistbell-v3-final-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-verified-apk:
    # The push trigger is intentionally opt-in: only a commit explicitly marked
    # [build-v3-apk] can publish an APK. Manual workflow_dispatch also runs it.
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[build-v3-apk]') }}
    name: Verify 3.0 source, then package debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact source commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure root Gradle wrapper is executable
        run: chmod +x ./gradlew

      - name: Compile and run unit tests before packaging
        run: ./gradlew -p mistbell-v3 :app:compileDebugKotlin :app:testDebugUnitTest --no-daemon --no-parallel

      - name: Package final debug APK only after tests pass
        run: ./gradlew -p mistbell-v3 :app:assembleDebug --no-daemon --no-parallel

      - name: Generate APK checksum and source provenance
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build-artifacts
          find mistbell-v3/app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' -exec cp {} build-artifacts/ \;
          test -n "$(find build-artifacts -maxdepth 1 -type f -name '*.apk' -print -quit)"
          cd build-artifacts
          sha256sum *.apk | tee SHA256SUMS.txt
          printf 'source_sha=%s\nworkflow_run_id=%s\nartifact_role=3.0-device-test-debug-apk\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" > SOURCE.txt

      - name: Upload final device-test APK and provenance
        uses: actions/upload-artifact@v4
        with:
          name: mistbell-v3-device-test-apk-${{ github.run_number }}
          path: build-artifacts/*
          if-no-files-found: error
          retention-days: 14
