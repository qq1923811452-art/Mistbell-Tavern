name: Era Merged APK

# 单包：把 .NET 引擎注进主应用 APK。
#  1. dotnet publish 出 arm64 引擎 APK
#  2. Gradle 出主应用 APK（-PeraMerged=true，清单里启用 provider/service + :era 进程）
#  3. 脚本注入 assemblies/、lib/arm64-v8a/*.so、classesN.dex
#  4. zipalign + 用 dev key 重签

on:
  workflow_dispatch:
  push:
    branches:
      - "4.0幻想乡适配"
    paths:
      - "era-engine/**"
      - "mistbell-v3/app/src/main/java/com/mistbell/tavern/v3/feature/era/**"
      - "mistbell-v3/app/src/test/java/com/mistbell/tavern/v3/feature/era/**"
      - ".github/workflows/era-merged-apk.yml"
      - "mistbell-v3/app/src/main/AndroidManifest.xml"

env:
  ERA_UPSTREAM_REPO: https://github.com/LaoBro/era-core.git
  ERA_UPSTREAM_SHA: 6e14de0fa0cd83b0bb83df96fc29422e107f7af4
  MISTBELL_DEV_KEYSTORE: ${{ github.workspace }}/.github/keys/mistbell-dev.jks
  MISTBELL_DEV_KEYSTORE_PASSWORD: mistbelldev
  MISTBELL_DEV_KEY_ALIAS: mistbell-dev
  MISTBELL_DEV_KEY_PASSWORD: mistbelldev

concurrency:
  group: era-merged-${{ github.ref }}
  cancel-in-progress: true

jobs:
  merged-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
          dotnet-quality: "ga"

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Fetch engine sources
        run: |
          set -e
          rm -rf era-engine/upstream
          git init era-engine/upstream
          cd era-engine/upstream
          git remote add origin "$ERA_UPSTREAM_REPO"
          git fetch --depth 1 origin "$ERA_UPSTREAM_SHA"
          git checkout -q FETCH_HEAD

      - name: Apply EraCore patches (encoding / case-insensitive / float literals)
        run: git -C era-engine/upstream apply "$GITHUB_WORKSPACE/era-engine/patches/eracore-mistbell.patch"

      - name: Install Android workload
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          dotnet workload install android --skip-manifest-update

      - name: Publish arm64 engine APK
        run: |
          set -e
          dotnet publish era-engine/EraHost/EraHost.csproj \
            -c Release -f net10.0-android -r android-arm64 \
            -p:ApplicationId=com.mistbell.tavern.v3 \
            -p:AndroidPackageFormat=apk \
            -p:AndroidKeyStore=false \
            -p:CheckEolWorkloads=false \
            -p:TreatWarningsAsErrors=false \
            -v minimal

      - name: Build main app APK (merged manifest)
        run: |
          set -e
          chmod +x ./gradlew
          ./gradlew -p mistbell-v3 :app:assembleDebug -PeraMerged=true -PabiFilter=arm64-v8a --no-daemon --no-parallel

      - name: Merge engine into the app APK
        run: |
          set -e
          ENGINE=$(find era-engine/EraHost/bin/Release/net10.0-android -name '*.apk' | head -1)
          APP=$(find mistbell-v3/app/build/outputs/apk/debug -name '*.apk' | head -1)
          echo "ENGINE=$ENGINE"
          echo "APP=$APP"
          mkdir -p out
          python3 era-engine/scripts/merge_apks.py "$APP" "$ENGINE" out/merged-unsigned.apk

      - name: Align and sign
        run: |
          set -e
          BT=$(ls -d "$ANDROID_SDK_ROOT"/build-tools/* | sort -V | tail -1)
          "$BT/zipalign" -P 16 -f 4 out/merged-unsigned.apk out/merged-aligned.apk
          "$BT/apksigner" sign --ks "$MISTBELL_DEV_KEYSTORE" \
            --ks-pass "pass:$MISTBELL_DEV_KEYSTORE_PASSWORD" \
            --key-pass "pass:$MISTBELL_DEV_KEY_PASSWORD" \
            --ks-key-alias "$MISTBELL_DEV_KEY_ALIAS" \
            --out out/mistbell-era-merged.apk out/merged-aligned.apk
          "$BT/apksigner" verify --print-certs out/mistbell-era-merged.apk
          ls -la out/
          sha256sum out/mistbell-era-merged.apk

      - name: Upload merged APK
        uses: actions/upload-artifact@v4
        with:
          name: mistbell-era-merged-apk
          path: out/mistbell-era-merged.apk
          retention-days: 14
