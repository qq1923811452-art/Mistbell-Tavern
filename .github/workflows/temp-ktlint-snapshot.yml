name: Temporary Kotlin formatter snapshot

on:
  pull_request:
    branches: [codex/pr31-memory-pipeline-2026-10-15]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  format-snapshot:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'codex/embeddinggemma2-litert-android-2026-10-15'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Apply ktlint formatter
        run: |
          chmod +x gradlew
          ./gradlew :app:ktlintFormat --rerun-tasks --no-daemon || true
      - name: Commit formatter changes to the PR branch
        env:
          BRANCH_NAME: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          if git diff --quiet -- app/src; then
            echo "No Kotlin formatting changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src
          git commit -m "style: apply ktlint formatting to embedding branch"
          git push origin "HEAD:${BRANCH_NAME}"
      - name: Upload formatted source snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: temp-ktlint-formatted-sources
          path: app/src/**/*.kt
          if-no-files-found: error
          retention-days: 1
