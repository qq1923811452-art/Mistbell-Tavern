name: Mistbell 3.0 Generate Independent Detekt Baseline

on:
  workflow_dispatch:
  pull_request:
    branches:
      - codex/mistbell-development-3.0
    paths:
      - 'mistbell-v3/**'
      - '.github/workflows/mistbell-v3-generate-detekt-baseline.yml'
  push:
    branches:
      - codex/mistbell-v3-independent-detekt-baseline

permissions:
  contents: write

concurrency:
  group: mistbell-v3-independent-detekt-baseline
  cancel-in-progress: false

jobs:
  generate-baseline:
    name: Generate baseline from current Mistbell 3.0 source
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate independent 3.0 Detekt baseline
        run: ./gradlew -p mistbell-v3 :app:detektBaseline --no-daemon --no-parallel

      - name: Commit generated baseline to PR branch
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mistbell-v3/config/detekt/baseline.xml
          if git diff --cached --quiet; then
            echo "Generated baseline is already up to date."
          else
            git commit -m "Generate independent Mistbell 3.0 Detekt baseline"
            git push origin HEAD:refs/heads/${{ github.event.pull_request.head.ref }}
          fi

      - name: Upload generated baseline
        uses: actions/upload-artifact@v4
        with:
          name: mistbell-v3-detekt-baseline
          path: mistbell-v3/config/detekt/baseline.xml
          if-no-files-found: error
          retention-days: 7
