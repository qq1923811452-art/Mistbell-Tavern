name: Era Engine APK

# 构建 era（Emuera 无头 EWP）宿主 APK。
# 上游引擎源码不在本仓库，构建时按固定提交拉取，再用 era-engine/EraHost 里
# 只增不改的工程把它编成 Android 服务包。

on:
  workflow_dispatch:
  push:
    branches:
      - "4.0幻想乡适配"
    paths:
      - "era-engine/**"
      - ".github/workflows/era-engine-build.yml"

concurrency:
  group: era-engine-${{ github.ref }}
  cancel-in-progress: true

env:
  ERA_UPSTREAM_REPO: https://github.com/LaoBro/era-core.git
  ERA_UPSTREAM_SHA: 6e14de0fa0cd83b0bb83df96fc29422e107f7af4

jobs:
  build-engine-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
          dotnet-quality: "ga"

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Fetch engine sources
        run: |
          set -e
          rm -rf era-engine/upstream
          git init era-engine/upstream
          cd era-engine/upstream
          git remote add origin "$ERA_UPSTREAM_REPO"
          git fetch --depth 1 origin "$ERA_UPSTREAM_SHA"
          git checkout -q FETCH_HEAD
          echo "engine commit: $(git rev-parse HEAD)"
          ls

      - name: Guard .NET SDK version
        run: |
          set -e
          V=$(dotnet --version)
          echo "SDK in use: $V"
          case "$V" in
            10.0.*) echo "OK: .NET 10" ;;
            *) echo "::error::期望 .NET 10，实际 $V（global.json 未生效）"; exit 1 ;;
          esac

      - name: Apply EraCore patches (encoding / case-insensitive / float literals)
        run: git -C era-engine/upstream apply "$GITHUB_WORKSPACE/era-engine/patches/eracore-mistbell.patch"

      - name: Install Android workload
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          dotnet workload install android --skip-manifest-update
          dotnet --info | head -20

      - name: Publish unsigned APK
        run: |
          set -e
          dotnet publish era-engine/EraHost/EraHost.csproj \
            -c Release -f net10.0-android -r android-arm64 \
            -p:AndroidSupportedAbis="arm64-v8a" \
            -p:AndroidPackageFormat=apk \
            -p:AndroidKeyStore=false \
            -p:CheckEolWorkloads=false \
            -p:TreatWarningsAsErrors=false \
            -v minimal

      - name: Locate APK
        id: apk
        run: |
          set -e
          DIR=era-engine/EraHost/bin/Release/net10.0-android
          ls -la "$DIR" || true
          APK=$(find "$DIR" -maxdepth 2 -name '*.apk' ! -name '*-Signed.apk' | head -1)
          test -n "$APK" || { echo "未找到 APK"; exit 1; }
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          echo "APK: $APK"

      - name: Sign APK
        run: |
          set -e
          APK="${{ steps.apk.outputs.path }}"
          mkdir -p out
          BT=$(ls -d "$ANDROID_SDK_ROOT"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" sign --ks .github/keys/mistbell-dev.jks \
            --ks-pass pass:mistbelldev --key-pass pass:mistbelldev \
            --ks-key-alias mistbell-dev \
            --out out/mistbell-era-engine.apk "$APK"
          "$BT/apksigner" verify --print-certs out/mistbell-era-engine.apk
          sha256sum out/mistbell-era-engine.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mistbell-era-engine-apk
          path: out/mistbell-era-engine.apk
          retention-days: 30
