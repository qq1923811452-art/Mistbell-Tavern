name: CI

on:
  push:
    branches: [ feature, main, master ]
  pull_request:

jobs:
  verify:
    name: Compile, test, and verify
    runs-on: ubuntu-latest
    outputs:
      tested_sha: ${{ steps.source_sha.outputs.sha }}
    steps:
      - name: Checkout exact source commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # GitHub 托管的 ubuntu-latest runner 已预装 Android SDK，
      # 不再调用 setup-android 安装旧的 "tools" 包，避免 sdkmanager 报错。

      - name: Set up Gradle（缓存与校验）
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure gradlew executable（防御 Windows 提交丢失可执行位）
        run: chmod +x gradlew

      - name: Record exact source commit
        id: source_sha
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Apply Kotlin formatting
        # Keep CI formatting behavior aligned with the verified APK workflow.
        # The ktlintCheck task below remains a required gate after formatting.
        # The license-report plugin is not configuration-cache compatible, so disable the cache for this invocation.
        run: ./gradlew :app:ktlintFormat --rerun-tasks --no-daemon --no-configuration-cache || echo "Formatting reported baseline/style issues; continuing to the required ktlintCheck gate."

      - name: Build & Verify
        # Build + unit tests + detekt + ktlint + license guard; no quality checks are skipped.
        # The license-report plugin is not configuration-cache compatible; disable cache to avoid unrelated Detekt/configuration-cache failures.
        run: ./gradlew :app:compileDebugKotlin :app:testDebugUnitTest :app:detekt :app:ktlintCheck licenseGuard --continue --no-daemon --no-parallel --no-configuration-cache

      - name: Upload reports (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: verification-reports
          path: |
            app/build/reports/**
            build/reports/**
          if-no-files-found: ignore


  # Run Android instrumented tests on every successful CI quality gate.
  # This builds only the APKs needed to execute tests; it does not publish a final APK.
  instrumented-tests:
    needs: verify
    if: ${{ needs.verify.result == 'success' }}
    name: Android emulator and migration validation
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout the exact verified commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify.outputs.tested_sha }}
          fetch-depth: 0

      - name: Confirm checked-out commit matches quality-gate commit
        shell: bash
        env:
          VERIFIED_SHA: ${{ needs.verify.outputs.tested_sha }}
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          test "$actual_sha" = "$VERIFIED_SHA"
          test "$actual_sha" = "$SOURCE_SHA"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure gradlew executable
        run: chmod +x ./gradlew

      - name: Enable KVM for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=/dev/kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run instrumented vector and Room migration tests
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: ./gradlew :app:connectedDebugAndroidTest --no-daemon --no-parallel

      - name: Upload Android instrumentation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-instrumented-test-reports-${{ github.run_number }}
          path: |
            app/build/reports/androidTests/connected/**
            app/build/outputs/androidTest-results/connected/**
          if-no-files-found: ignore
          retention-days: 14
