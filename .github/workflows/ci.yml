name: CI

on:
  push:
    branches: [feature, mistbell-2.0, main, master, 'upgrade/**']
    paths:
      - "app/**"
      - "config/**"
      - "gradle/**"
      - "gradlew"
      - "gradle.properties"
      - "build.gradle*"
      - "settings.gradle*"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "app/**"
      - "config/**"
      - "gradle/**"
      - "gradlew"
      - "gradle.properties"
      - "build.gradle*"
      - "settings.gradle*"
      - ".github/workflows/**"
  workflow_call:

permissions:
  contents: write

concurrency:
  group: mistbell-ci-${{ github.event.pull_request.number || github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build, unit tests, static checks, and APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Generate Room v26 schema from its source point
        if: ${{ github.event.pull_request.number == 29 }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin f857bf4
          git worktree add /tmp/mistbell-room-v26 f857bf4
          chmod +x /tmp/mistbell-room-v26/gradlew
          cd /tmp/mistbell-room-v26
          ./gradlew :app:compileDebugKotlin --no-daemon --no-parallel
          test -f app/schemas/com.mistbell.tavern.android.data.local.AppDatabase/26.json
          mkdir -p "$GITHUB_WORKSPACE/room-schema-v26"
          cp app/schemas/com.mistbell.tavern.android.data.local.AppDatabase/26.json "$GITHUB_WORKSPACE/room-schema-v26/26.json"

      - name: Upload generated Room v26 schema
        if: ${{ always() && github.event.pull_request.number == 29 && hashFiles('room-schema-v26/26.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: room-schema-v26
          path: room-schema-v26/26.json
          if-no-files-found: error
          retention-days: 14


      - name: Ensure Gradle wrapper is executable
        run: chmod +x ./gradlew

      - name: Run quality gate
        id: quality_gate
        run: ./gradlew :app:assembleDebug :app:testDebugUnitTest :app:detekt :app:ktlintCheck licenseGuard --continue --no-daemon --no-parallel
      
      - name: Commit compiler-generated Room v27 schema
        if: ${{ always() && hashFiles('app/schemas/com.mistbell.tavern.android.data.local.AppDatabase/27.json') != '' }}
        env:
          TARGET_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/schemas/com.mistbell.tavern.android.data.local.AppDatabase/27.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(db): add compiler-generated Room schema v27"
            git push origin "HEAD:${TARGET_BRANCH}"
          fi
      # Keep Room's compiler-generated schema available for review and committing.
      # In particular, migration PRs must not hand-author identity hashes.
      - name: Upload generated Room schema
        if: ${{ always() && hashFiles('app/schemas/com.mistbell.tavern.android.data.local.AppDatabase/27.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: room-schema-v27
          path: app/schemas/com.mistbell.tavern.android.data.local.AppDatabase/27.json
          if-no-files-found: error
          retention-days: 14

      - name: Generate APK checksum
        if: ${{ always() && hashFiles('app/build/outputs/apk/debug/*.apk') != '' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build-artifacts
          find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' -exec cp {} build-artifacts/ \;
          test -n "$(find build-artifacts -maxdepth 1 -type f -name '*.apk' -print -quit)"
          cd build-artifacts
          sha256sum *.apk | tee SHA256SUMS.txt
          printf 'source_sha=%s\ntested_sha=%s\nworkflow_run_id=%s\nquality_gate=%s\n' "${{ github.event.pull_request.head.sha || github.sha }}" "$GITHUB_SHA" "$GITHUB_RUN_ID" "${{ steps.quality_gate.outcome }}" > SOURCE.txt

      - name: Upload APK and checksum
        if: ${{ always() && hashFiles('build-artifacts/*.apk') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: mistbell-${{ steps.quality_gate.outcome == 'success' && 'verified' || 'unverified' }}-debug-apk-${{ github.run_number }}
          path: build-artifacts/*
          if-no-files-found: error
          retention-days: 14

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: verification-reports
          path: |
            app/build/reports/**
            build/reports/**
          if-no-files-found: ignore
          retention-days: 14

  instrumented-tests:
    name: Android emulator and migration tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure Gradle wrapper is executable
        run: chmod +x ./gradlew

      - name: Enable KVM for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run instrumented vector and Room migration tests
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: ./gradlew :app:connectedDebugAndroidTest --no-daemon --no-parallel
