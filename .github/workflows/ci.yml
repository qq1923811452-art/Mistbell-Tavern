name: CI

on:
  push:
    branches: [ feature, main, master ]
  pull_request:

jobs:
  verify:
    name: Build & Verify (F0 质量门)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # GitHub 托管的 ubuntu-latest runner 已预装 Android SDK，
      # 不再调用 setup-android 安装旧的 "tools" 包，避免 sdkmanager 报错。

      - name: Set up Gradle（缓存与校验）
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure gradlew executable（防御 Windows 提交丢失可执行位）
        run: chmod +x gradlew

      - name: Apply Kotlin formatting
        # Keep CI formatting behavior aligned with the verified APK workflow.
        # The ktlintCheck task below remains a required gate after formatting.
        run: ./gradlew :app:ktlintFormat --rerun-tasks --no-daemon --no-parallel || echo "Formatting reported baseline/style issues; continuing to the required ktlintCheck gate."

      - name: Build & Verify
        # Build + unit tests + detekt + ktlint. License audit is a separate advisory step below.
        run: ./gradlew :app:assembleDebug :app:testDebugUnitTest :app:detekt :app:ktlintCheck --continue --no-daemon --no-parallel

      - name: License audit (advisory until upstream plugin issue is fixed)\n        continue-on-error: true\n        run: ./gradlew licenseGuard --no-daemon --no-parallel\n\n      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: mistbell-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload reports (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: verification-reports
          path: |
            app/build/reports/**
            build/reports/**
          if-no-files-found: ignore
