name: CI

on:
  push:
    branches: [feature, mistbell-2.0, main, master, 'upgrade/**']
    paths:
      - "app/**"
      - "config/**"
      - "gradle/**"
      - "gradlew"
      - "gradle.properties"
      - "build.gradle*"
      - "settings.gradle*"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "app/**"
      - "config/**"
      - "gradle/**"
      - "gradlew"
      - "gradle.properties"
      - "build.gradle*"
      - "settings.gradle*"
      - ".github/workflows/**"
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mistbell-ci-${{ github.event.pull_request.number || github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  verify:
    name: Compile, unit tests, and static checks
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Ensure Gradle wrapper is executable
        run: chmod +x ./gradlew

      - name: Run quality gate
        id: quality_gate
        run: ./gradlew :app:compileDebugKotlin :app:testDebugUnitTest :app:detekt :app:ktlintCheck licenseGuard --continue --no-daemon --no-parallel
      
      # Keep Room's compiler-generated schema available for review and committing.
      # In particular, migration PRs must not hand-author identity hashes.
      - name: Upload generated Room schema
        if: ${{ always() && hashFiles('app/schemas/com.mistbell.tavern.android.data.local.AppDatabase/27.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: room-schema-v27
          path: app/schemas/com.mistbell.tavern.android.data.local.AppDatabase/27.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: verification-reports
          path: |
            app/build/reports/**
            build/reports/**
          if-no-files-found: ignore
          retention-days: 14

  instrumented-tests:
    if: github.event_name == 'workflow_dispatch'
    name: Final APK, Android emulator, and migration validation
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure Gradle wrapper is executable
        run: chmod +x ./gradlew

      - name: Enable KVM for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run instrumented vector and Room migration tests
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: ./gradlew :app:assembleDebug :app:connectedDebugAndroidTest --no-daemon --no-parallel

      - name: Upload final debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: mistbell-final-debug-apk-${{ github.run_number }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
