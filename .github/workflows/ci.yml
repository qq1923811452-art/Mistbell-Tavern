name: CI

on:
  push:
    branches: [feature, mistbell-2.0, main, master, 'upgrade/**']
    paths:
      - "app/**"
      - "config/**"
      - "gradle/**"
      - "gradlew"
      - "gradle.properties"
      - "build.gradle*"
      - "settings.gradle*"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "app/**"
      - "config/**"
      - "gradle/**"
      - "gradlew"
      - "gradle.properties"
      - "build.gradle*"
      - "settings.gradle*"
      - ".github/workflows/**"
  workflow_dispatch:
    inputs:
      full_android_validation:
        description: "Run emulator tests and build the debug APK (final-stage validation)"
        required: true
        type: boolean
        default: false
  workflow_call:
    inputs:
      full_android_validation:
        description: "Run emulator tests and build the debug APK (final-stage validation)"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: mistbell-ci-${{ github.event.pull_request.number || github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  verify:
    name: Kotlin compile, unit tests, and static checks
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Ensure Gradle wrapper is executable
        run: chmod +x ./gradlew

      - name: Run quality gate
        id: quality_gate
        run: ./gradlew :app:compileDebugKotlin :app:testDebugUnitTest :app:detekt :app:ktlintCheck licenseGuard --continue --no-daemon --no-parallel
      
      # Keep Room's compiler-generated schema available for review and committing.
      # In particular, migration PRs must not hand-author identity hashes.
      - name: Upload generated Room schema
        if: ${{ always() && hashFiles('app/schemas/com.mistbell.tavern.android.data.local.AppDatabase/27.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: room-schema-v27
          path: app/schemas/com.mistbell.tavern.android.data.local.AppDatabase/27.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: verification-reports
          path: |
            app/build/reports/**
            build/reports/**
          if-no-files-found: ignore
          retention-days: 14

  instrumented-tests:
    if: ${{ inputs.full_android_validation }}
    name: Final Android emulator, APK, and migration validation
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure Gradle wrapper is executable
        run: chmod +x ./gradlew

      - name: Install Android NDK and Bazelisk for Qualcomm dispatch
        run: |
          set -euo pipefail
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "$sdkmanager" --licenses < <(yes)
          "$sdkmanager" "ndk;28.1.13356709"
          test -d "$ANDROID_HOME/ndk/28.1.13356709"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.1.13356709" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/28.1.13356709" >> "$GITHUB_ENV"
          curl -fL --retry 3 https://github.com/bazelbuild/bazelisk/releases/download/v1.28.1/bazelisk-linux-amd64 -o /tmp/bazel
          chmod +x /tmp/bazel
          /tmp/bazel --version
          sudo mv /tmp/bazel /usr/local/bin/bazel

      - name: Checkout LiteRT Qualcomm dispatch source pinned to LiteRT-LM 0.18.0
        uses: actions/checkout@v4
        with:
          repository: google-ai-edge/LiteRT
          ref: 26895c9fbcc25c43faa8c1a98cd1fd28951602c3
          path: .ci/litert-dispatch

      - name: Download matching Qualcomm AI Runtime SDK 2.50.0
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/qairt"
          curl -fL --retry 3 --retry-delay 5 \
            "https://softwarecenter.qualcomm.com/api/download/software/sdks/Qualcomm_AI_Runtime_Community/All/2.50.0.260828/v2.50.0.260828.zip" \
            -o "$RUNNER_TEMP/qairt-sdk.zip"
          unzip -q "$RUNNER_TEMP/qairt-sdk.zip" -d "$RUNNER_TEMP/qairt"
          qnn_library="$(find "$RUNNER_TEMP/qairt" -type f -path '*/lib/aarch64-android/libQnnHtp.so' -print -quit)"
          test -n "$qnn_library"
          qnn_root="${qnn_library%/lib/aarch64-android/libQnnHtp.so}"
          test -f "$qnn_root/lib/aarch64-android/libQnnSystem.so"
          echo "LITERT_QAIRT_SDK=$qnn_root" >> "$GITHUB_ENV"
          echo "QNN_SDK_ROOT=$qnn_root" >> "$GITHUB_ENV"
          license_dir="$GITHUB_WORKSPACE/app/src/main/assets/licenses/qualcomm-qairt"
          mkdir -p "$license_dir"
          find "$qnn_root" -maxdepth 2 -type f \\( -iname 'LICENSE*' -o -iname 'EULA*' -o -iname 'NOTICE*' \\) -print0 |
            while IFS= read -r -d '' license_file; do
              cp "$license_file" "$license_dir/$(basename "$license_file")"
            done

      - name: Build LiteRT Qualcomm dispatch library for the pinned runtime
        working-directory: .ci/litert-dispatch
        run: |
          set -euo pipefail
          bazel build --config=android_arm64 //litert/vendors/qualcomm/dispatch:dispatch_api_so
          dispatch_library="$(find bazel-bin/litert/vendors/qualcomm/dispatch -type f -name 'libLiteRtDispatch_Qualcomm.so' -print -quit)"
          test -n "$dispatch_library"
          native_dir="$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a"
          qnn_lib_dir="$QNN_SDK_ROOT/lib/aarch64-android"
          mkdir -p "$native_dir"
          cp "$dispatch_library" "$native_dir/"
          cp "$qnn_lib_dir/libQnnHtp.so" "$native_dir/"
          cp "$qnn_lib_dir/libQnnSystem.so" "$native_dir/"
          cp "$qnn_lib_dir/libQnnHtpPrepare.so" "$native_dir/"
          find "$qnn_lib_dir" -maxdepth 1 -type f -name 'libQnnHtpV75*.so' -exec cp {} "$native_dir/" \\;
          skel_library="$(find "$QNN_SDK_ROOT" -type f -name 'libQnnHtpV75Skel.so' -print -quit)"
          test -n "$skel_library"
          cp "$skel_library" "$native_dir/"
          for library in libLiteRtDispatch_Qualcomm.so libQnnHtp.so libQnnSystem.so libQnnHtpPrepare.so libQnnHtpV75Stub.so libQnnHtpV75Skel.so; do
            test -s "$native_dir/$library"
          done
          echo "Matching LiteRT-LM dispatch and SM8650 QAIRT 2.50.0 libraries staged for final APK."

      - name: Enable KVM for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run instrumented vector and Room migration tests
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: ./gradlew -PqualcommNpuRuntime :app:assembleDebug :app:connectedDebugAndroidTest --no-daemon --no-parallel

      - name: Generate APK checksum
        if: ${{ always() && hashFiles('app/build/outputs/apk/debug/*.apk') != '' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build-artifacts
          find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' -exec cp {} build-artifacts/ \;
          test -n "$(find build-artifacts -maxdepth 1 -type f -name '*.apk' -print -quit)"
          cd build-artifacts
          sha256sum *.apk | tee SHA256SUMS.txt
          printf 'source_sha=%s\ntested_sha=%s\nworkflow_run_id=%s\n' "${{ github.event.pull_request.head.sha || github.sha }}" "$GITHUB_SHA" "$GITHUB_RUN_ID" > SOURCE.txt

      - name: Upload final APK and checksum
        if: ${{ always() && hashFiles('build-artifacts/*.apk') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: mistbell-final-debug-apk-${{ github.run_number }}
          path: build-artifacts/*
          if-no-files-found: error
          retention-days: 14
