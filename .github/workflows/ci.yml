name: CI

on:
  push:
    branches: [main, master, feature, "upgrade/**"]
    paths:
      - "app/**"
      - "gradle/**"
      - "gradlew"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/ci.yml"
      - ".github/workflows/build-apk.yml"
  pull_request:
    branches: [main, master, feature, "upgrade/**"]
    paths:
      - "app/**"
      - "gradle/**"
      - "gradlew"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/ci.yml"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:
    inputs:
      full_android_validation:
        description: "Build the final APK and run Android emulator/migration tests"
        required: false
        type: boolean
        default: false
  workflow_call:
    inputs:
      full_android_validation:
        description: "Build the final APK and run Android emulator/migration tests"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: mistbell-ci-${{ github.event.pull_request.number || github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  verify:
    name: Kotlin compile, unit tests, and static checks
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      quality_gate: ${{ steps.quality_gate.outcome }}
      tested_sha: ${{ steps.source_sha.outputs.sha }}
    steps:
      - name: Checkout exact source commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Record exact source commit
        id: source_sha
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Run quality gate
        id: quality_gate
        run: ./gradlew :app:compileDebugKotlin :app:testDebugUnitTest :app:detekt :app:ktlintCheck licenseGuard --continue --no-daemon --no-parallel

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: verification-reports-${{ github.run_number }}
          path: |
            app/build/reports/**
            build/reports/**
          if-no-files-found: ignore
          retention-days: 14

  instrumented-tests:
    name: Final APK, Android emulator, and migration validation
    needs: verify
    if: ${{ needs.verify.result == 'success' && needs.verify.outputs.quality_gate == 'success' && inputs.full_android_validation == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout the exact verified commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify.outputs.tested_sha }}
          fetch-depth: 0

      - name: Confirm checked-out commit matches quality-gate commit
        shell: bash
        env:
          VERIFIED_SHA: ${{ needs.verify.outputs.tested_sha }}
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          test "$actual_sha" = "$VERIFIED_SHA"
          test "$actual_sha" = "$SOURCE_SHA"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Enable KVM for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build APK and run Android migration tests
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: ./gradlew :app:assembleDebug :app:connectedDebugAndroidTest --no-daemon --no-parallel

      - name: Generate APK checksum and provenance
        if: success()
        shell: bash
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          VERIFIED_SHA: ${{ needs.verify.outputs.tested_sha }}
          QUALITY_GATE: ${{ needs.verify.outputs.quality_gate }}
        run: |
          set -euo pipefail
          tested_sha="$(git rev-parse HEAD)"
          test "$tested_sha" = "$SOURCE_SHA"
          test "$tested_sha" = "$VERIFIED_SHA"
          test "$QUALITY_GATE" = "success"
          mkdir -p build-artifacts
          find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' -exec cp {} build-artifacts/ \;
          test -n "$(find build-artifacts -maxdepth 1 -type f -name '*.apk' -print -quit)"
          cd build-artifacts
          sha256sum *.apk | tee SHA256SUMS.txt
          printf 'source_sha=%s\ntested_sha=%s\nworkflow_run_id=%s\nquality_gate=%s\n' "$SOURCE_SHA" "$tested_sha" "$GITHUB_RUN_ID" "$QUALITY_GATE" > SOURCE.txt

      - name: Upload verified APK, checksum, and provenance
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: mistbell-${{ needs.verify.outputs.quality_gate == 'success' && 'verified' || 'unverified' }}-debug-apk-${{ github.run_number }}
          path: build-artifacts/*
          if-no-files-found: error
          retention-days: 14

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: final-validation-reports-${{ github.run_number }}
          path: |
            app/build/reports/**
            build/reports/**
          if-no-files-found: ignore
          retention-days: 14
