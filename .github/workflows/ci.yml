name: CI

on:
  push:
    branches: [feature, mistbell-2.0, main, master, 'upgrade/**']
    paths:
      - "app/**"
      - "config/**"
      - "gradle/**"
      - "gradlew"
      - "gradle.properties"
      - "build.gradle*"
      - "settings.gradle*"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "app/**"
      - "config/**"
      - "gradle/**"
      - "gradlew"
      - "gradle.properties"
      - "build.gradle*"
      - "settings.gradle*"
      - ".github/workflows/**"
  workflow_call:

permissions:
  contents: read

concurrency:
  group: mistbell-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build, unit tests, static checks, and APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure Gradle wrapper is executable
        run: chmod +x ./gradlew

      - name: Run quality gate
        run: ./gradlew :app:assembleDebug :app:testDebugUnitTest :app:detekt :app:ktlintCheck licenseGuard --continue --no-daemon --no-parallel

      - name: Generate APK checksum
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build-artifacts
          find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' -exec cp {} build-artifacts/ \;
          test -n "$(find build-artifacts -maxdepth 1 -type f -name '*.apk' -print -quit)"
          cd build-artifacts
          sha256sum *.apk | tee SHA256SUMS.txt

      - name: Upload verified APK and checksum
        uses: actions/upload-artifact@v4
        with:
          name: mistbell-verified-debug-apk
          path: build-artifacts/*
          if-no-files-found: error
          retention-days: 14

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: verification-reports
          path: |
            app/build/reports/**
            build/reports/**
          if-no-files-found: ignore
          retention-days: 14

  instrumented-tests:
    name: Android emulator and migration tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure Gradle wrapper is executable
        run: chmod +x ./gradlew

      - name: Run instrumented vector and Room migration tests
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: ./gradlew :app:connectedDebugAndroidTest --no-daemon --no-parallel
