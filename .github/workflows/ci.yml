name: CI

permissions:
  contents: write

on:
  push:
    branches: [ feature, main, master, 'upgrade/**' ]
  pull_request:

jobs:
  verify:
    name: Build & Verify (F0 质量门)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # GitHub 托管的 ubuntu-latest runner 已预装 Android SDK，
      # 不再调用 setup-android 安装旧的 "tools" 包，避免 sdkmanager 报错。

      - name: Set up Gradle（缓存与校验）
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure gradlew executable（防御 Windows 提交丢失可执行位）
        run: chmod +x gradlew

      - name: Build & Verify
        # Build + unit tests + detekt + ktlint. License audit is a required gate below.
        run: ./gradlew :app:assembleDebug :app:testDebugUnitTest :app:detekt :app:ktlintCheck --continue --no-daemon --no-parallel

      - name: License audit (required)
        run: ./gradlew licenseGuard --stacktrace --no-daemon --no-parallel

      - name: Upload generated Room v26 schema
        if: ${{ always() && hashFiles('app/schemas/com.mistbell.tavern.android.data.local.AppDatabase/26.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: room-schema-v26
          path: app/schemas/com.mistbell.tavern.android.data.local.AppDatabase/26.json
          if-no-files-found: error
          retention-days: 14

      - name: Commit generated Room v26 schema
        if: ${{ success() && hashFiles('app/schemas/com.mistbell.tavern.android.data.local.AppDatabase/26.json') != '' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/schemas/com.mistbell.tavern.android.data.local.AppDatabase/26.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(db): add Room schema v26 generated by compiler"
            git push
          fi

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: mistbell-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload reports (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: verification-reports
          path: |
            app/build/reports/**
            build/reports/**
          if-no-files-found: ignore
