name: Mistbell 3.0 Clean-Room CI

on:
  push:
    branches:
      - codex/mistbell-development-3.0
    paths:
      - "mistbell-v3/**"
      - ".github/workflows/mistbell-v3-ci.yml"
  pull_request:
    paths:
      - "mistbell-v3/**"
      - ".github/workflows/mistbell-v3-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mistbell-v3-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile-and-test:
    name: Compile and focused JVM tests (no APK)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Compile clean-room 3.0 app
        run: ./gradlew -p mistbell-v3 :app:compileDebugKotlin --no-daemon --no-parallel
      - name: Run clean-room 3.0 unit tests
        run: ./gradlew -p mistbell-v3 :app:testDebugUnitTest --no-daemon --no-parallel
