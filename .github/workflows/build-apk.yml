name: Build Debug APK

on:
  workflow_dispatch:
    inputs:
      build_variant:
        description: "Android build variant"
        required: true
        type: choice
        options:
          - debug
        default: debug
  push:
    branches:
      - feature
    paths:
      - "app/**"
      - "gradle/**"
      - "gradlew"
      - "build.gradle*"
      - "settings.gradle*"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and package APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Generate SHA-256 checksum
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build-artifacts
          find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' -exec cp {} build-artifacts/ \;
          test -n "$(find build-artifacts -maxdepth 1 -type f -name '*.apk' -print -quit)"
          cd build-artifacts
          sha256sum *.apk | tee SHA256SUMS.txt

      - name: Upload APK and checksum
        uses: actions/upload-artifact@v4
        with:
          name: mistbell-debug-apk-${{ github.run_number }}
          path: build-artifacts/*
          if-no-files-found: error
          retention-days: 14
