name: Build Verified Debug APK

on:
  workflow_dispatch:
    inputs:
      build_variant:
        description: "Android build variant"
        required: true
        type: choice
        options:
          - debug
        default: debug
  push:
    branches:
      - feature
      - mistbell-2.0
      - 'upgrade/**'
    paths:
      - "app/**"
      - "gradle/**"
      - "gradlew"
      - "build.gradle*"
      - "settings.gradle*"
      - ".github/workflows/build-apk.yml"
      - ".github/workflows/ci.yml"

permissions:
  contents: read

concurrency:
  group: build-verified-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-build:
    name: Quality gate and package APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Apply Kotlin formatting
        # ktlintFormat can exit non-zero when baseline entries are encountered.
        # Keep verification authoritative: ktlintCheck below must still pass.
        run: ./gradlew :app:ktlintFormat --no-daemon --no-parallel || echo "Formatting reported baseline/style issues; continuing to the required ktlintCheck gate."

      - name: Run full quality gate and build APK
        run: ./gradlew :app:assembleDebug :app:testDebugUnitTest :app:detekt :app:ktlintCheck licenseGuard --continue --no-daemon --no-parallel

      - name: Generate SHA-256 checksum
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build-artifacts
          find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' -exec cp {} build-artifacts/ \;
          test -n "$(find build-artifacts -maxdepth 1 -type f -name '*.apk' -print -quit)"
          cd build-artifacts
          sha256sum *.apk | tee SHA256SUMS.txt

      - name: Upload verified APK and checksum
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: mistbell-verified-debug-apk-${{ github.run_number }}
          path: build-artifacts/*
          if-no-files-found: error
          retention-days: 14

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: verification-reports-${{ github.run_number }}
          path: |
            app/build/reports/**
            build/reports/**
          if-no-files-found: ignore
          retention-days: 14
