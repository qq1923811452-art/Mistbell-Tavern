name: Era AAR Probe

# 探针任务：只回答一个问题——「.NET 引擎能不能作为 AAR 被 Java/Kotlin 应用消费」。
# 不产出正式包；结果决定后续是否把引擎收进主 APK（单包路线）。
# 与 era-engine-build.yml 分开，避免和正式构建抢同一个 concurrency 组。

on:
  workflow_dispatch:
  push:
    branches:
      - "4.0幻想乡适配"
    paths:
      - "era-engine/**"
      - ".github/workflows/era-aar-probe.yml"

env:
  ERA_UPSTREAM_REPO: https://github.com/KuroPeach/SkiaX-android-CI.git
  ERA_UPSTREAM_SHA: 07bc3c054fce12d5fa0464597a7bb4c4a98847f2

jobs:
  probe-aar:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
          dotnet-quality: "ga"

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Fetch engine sources
        run: |
          set -e
          rm -rf era-engine/upstream
          git init era-engine/upstream
          cd era-engine/upstream
          git remote add origin "$ERA_UPSTREAM_REPO"
          git fetch --depth 1 origin "$ERA_UPSTREAM_SHA"
          git checkout -q FETCH_HEAD

      - name: Install Android workload
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          dotnet workload install android --skip-manifest-update

      - name: Publish as Android library
        run: |
          set -e
          dotnet publish era-engine/EraHost/EraHost.csproj \
            -c Release -f net8.0-android34.0 \
            -p:AndroidApplication=false \
            -p:OutputType=Library \
            -p:AndroidPackageFormat=aar \
            -p:AndroidKeyStore=false \
            -p:CheckEolWorkloads=false \
            -v minimal

      - name: Inspect AAR payload
        run: |
          set -e
          OUT=era-engine/EraHost/bin/Release/net8.0-android
          AAR=$(find "$OUT" -maxdepth 1 -name '*.aar' | head -1)
          echo "AAR=$AAR"
          if [ -z "$AAR" ]; then
            echo "::warning::未产出 AAR，列出构建输出"
            ls -la "$OUT" || true
            exit 0
          fi
          echo "=== 顶层 ==="
          unzip -l "$AAR" | head -40
          echo "=== 原生库 ==="
          unzip -l "$AAR" | grep -E 'lib/.*\.so|assemblies' | head -40 || true
          echo "=== AndroidManifest ==="
          unzip -p "$AAR" AndroidManifest.xml | head -40 || true
          echo "=== classes.jar 里的 Mono 引导类 ==="
          mkdir -p /tmp/aar && unzip -o -q "$AAR" -d /tmp/aar
          if [ -f /tmp/aar/classes.jar ]; then
            unzip -l /tmp/aar/classes.jar | grep -iE 'mono|runtime|Era' | head -40 || true
          fi
          echo "=== 是否存在运行时启动 provider ==="
          grep -o 'MonoRuntimeProvider' /tmp/aar/AndroidManifest.xml || echo "manifest 中无 MonoRuntimeProvider"

      - name: Upload AAR
        uses: actions/upload-artifact@v4
        with:
          name: era-engine-aar
          path: era-engine/EraHost/bin/Release/net8.0-android34.0/*.aar
          retention-days: 7
          if-no-files-found: warn
