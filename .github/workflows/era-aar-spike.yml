name: Era AAR Spike

# 只回答一个问题：按 .NET 8 的标准做法发布后，程序集到底在
#   APK 根目录 assemblies/ 还是 lib/<abi>/libassemblies.<abi>.so？
# 并尝试把 publish 产物重组成 AAR，把结构打全，供单包方案决策。

on:
  workflow_dispatch:
  push:
    branches:
      - era-aar-spike

env:
  ERA_UPSTREAM_REPO: https://github.com/KuroPeach/SkiaX-android-CI.git
  ERA_UPSTREAM_SHA: 07bc3c054fce12d5fa0464597a7bb4c4a98847f2
  CSPROJ: era-engine/EraHost/EraHost.csproj
  TFM: net8.0-android34.0
  RID: android-arm64

jobs:
  spike:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
          dotnet-quality: "ga"

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Fetch engine sources
        run: |
          set -e
          rm -rf era-engine/upstream
          git init era-engine/upstream
          cd era-engine/upstream
          git remote add origin "$ERA_UPSTREAM_REPO"
          git fetch --depth 1 origin "$ERA_UPSTREAM_SHA"
          git checkout -q FETCH_HEAD

      - name: Guard .NET SDK version
        run: |
          set -e
          V=$(dotnet --version)
          echo "SDK in use: $V"
          case "$V" in
            8.0.*) echo "OK" ;;
            *) echo "::error::期望 .NET 8，实际 $V"; exit 1 ;;
          esac

      - name: Install Android workload and archive tools
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          dotnet workload install android --skip-manifest-update
          sudo apt-get update -qq
          sudo apt-get install -y -qq p7zip-full

      - name: Publish engine APK
        run: |
          set -e
          dotnet publish "$CSPROJ" \
            -c Release -f "$TFM" -r "$RID" \
            -p:AndroidPackageFormat=apk \
            -p:AndroidKeyStore=false \
            -p:CheckEolWorkloads=false \
            -p:RunAOTCompilation=false \
            -p:AndroidUseAssemblyStore=true \
            -p:PublishTrimmed=false \
            -v minimal

      - name: Report where assemblies live
        run: |
          set -e
          APK=$(find "era-engine/EraHost/bin/Release/$TFM" -name '*.apk' | head -1)
          echo "APK=$APK"
          python3 era-engine/scripts/list_apk.py "$APK"

      - name: Reassemble AAR from publish output
        run: |
          set -e
          APK=$(find "era-engine/EraHost/bin/Release/$TFM" -name '*.apk' | head -1)
          MANIFEST=$(find "era-engine/EraHost/obj/Release/$TFM" -path '*android*' -name AndroidManifest.xml | head -1)
          MONO_JAR=$(find "$DOTNET_ROOT/packs" -name 'mono.android.jar' 2>/dev/null | head -1)
          echo "MANIFEST=$MANIFEST"
          echo "MONO_JAR=$MONO_JAR"
          python3 era-engine/scripts/make_aar.py \
            "$APK" "$MANIFEST" "$MONO_JAR" \
            "era-engine/EraHost/bin/Release/$TFM/MistbellEra.aar"

      - name: Inspect AAR
        run: |
          set -e
          python3 era-engine/scripts/list_apk.py "era-engine/EraHost/bin/Release/$TFM/MistbellEra.aar"

      - name: Upload AAR
        uses: actions/upload-artifact@v4
        with:
          name: era-aar-spike
          path: era-engine/EraHost/bin/Release/net8.0-android34.0/MistbellEra.aar
          retention-days: 3
          if-no-files-found: warn
