name: EraCore Android Build

# 只做一件事：把群友的 EraCore（.NET 10）Android 原生客户端编出来，
# 用来验证「这个内核能不能在真机上跑 eraTW」。通过后才谈替换与集成。

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/era-core-build.yml"

env:
  ERACORE_REPO: https://github.com/LaoBro/era-core.git
  ERACORE_SHA: 6e14de0fa0cd83b0bb83df96fc29422e107f7af4

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
          dotnet-quality: "ga"

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Fetch EraCore source
        run: |
          set -e
          rm -rf era-core-src
          git init era-core-src
          cd era-core-src
          git remote add origin "$ERACORE_REPO"
          git fetch --depth 1 origin "$ERACORE_SHA"
          git checkout -q FETCH_HEAD
          git rev-parse HEAD
          # 仓库根的 global.json 把 SDK 钉在 8.0；EraCore 需要 .NET 10，这里就近覆盖
          cat > global.json <<'JSON'
          {
            "sdk": {
              "version": "10.0.100",
              "rollForward": "latestFeature",
              "allowPrerelease": true
            }
          }
          JSON
          cat global.json

      - name: Show toolchain
        working-directory: era-core-src
        run: |
          dotnet --version
          case "$(dotnet --version)" in
            10.*) echo "OK: .NET 10" ;;
            *) echo "::error::期望 .NET 10，实际 $(dotnet --version)"; exit 1 ;;
          esac

      - name: Install Android workload
        working-directory: era-core-src
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          dotnet workload install android --skip-manifest-update

      - name: Publish EraCore Android APK
        working-directory: era-core-src
        run: |
          set -e
          dotnet publish EraCore.Native.Android/EraCore.Native.Android.csproj \
            -c Release -f net10.0-android -r android-arm64 \
            -p:AndroidPackageFormat=apk \
            -p:AndroidKeyStore=false \
            -p:CheckEolWorkloads=false \
            -p:RunAOTCompilation=false \
            -v minimal

      - name: Locate and sign APK
        run: |
          set -e
          APK=$(find era-core-src/EraCore.Native.Android/bin/Release -name '*.apk' ! -name '*-Signed.apk' | head -1)
          echo "APK=$APK"
          test -n "$APK" || { echo "::error::未找到 APK"; find era-core-src/EraCore.Native.Android/bin -maxdepth 4 -type d; exit 1; }
          mkdir -p out
          BT=$(ls -d "$ANDROID_SDK_ROOT"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" sign --ks .github/keys/mistbell-dev.jks \
            --ks-pass pass:mistbelldev --key-pass pass:mistbelldev \
            --ks-key-alias mistbell-dev \
            --out out/eracore-android.apk "$APK"
          "$BT/apksigner" verify --print-certs out/eracore-android.apk
          ls -la out/

      - name: Upload EraCore APK
        uses: actions/upload-artifact@v4
        with:
          name: eracore-android-apk
          path: out/eracore-android.apk
          retention-days: 14
