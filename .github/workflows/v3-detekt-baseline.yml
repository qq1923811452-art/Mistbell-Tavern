name: Generate Mistbell 3.0 Detekt baseline

on:
  pull_request:
    branches:
      - codex/mistbell-development-3.0
    paths:
      - "mistbell-v3/**"
      - ".github/workflows/v3-detekt-baseline.yml"

permissions:
  contents: write

jobs:
  generate-baseline:
    name: Generate and upload Detekt baseline
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout PR source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate baseline from current 3.0 source
        run: |
          chmod +x ./gradlew
          ./gradlew -p mistbell-v3 :app:detektBaseline --no-daemon --stacktrace

      - name: Commit generated baseline to this PR branch
        if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'codex/3.0-detekt-baseline-20261020' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mistbell-v3/config/detekt/baseline.xml
          if git diff --cached --quiet; then
            echo "Baseline is unchanged; no commit needed."
            exit 0
          fi
          git commit -m "Add generated Detekt baseline for Mistbell 3.0"
          git push origin HEAD:refs/heads/codex/3.0-detekt-baseline-20261020
      - name: Upload generated baseline for review
        uses: actions/upload-artifact@v4
        with:
          name: mistbell-v3-detekt-baseline
          path: mistbell-v3/config/detekt/baseline.xml
          if-no-files-found: error
          retention-days: 7
