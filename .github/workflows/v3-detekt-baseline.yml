name: Generate Mistbell 3.0 Detekt baseline

on:
  pull_request:
    branches:
      - codex/mistbell-development-3.0
    paths:
      - "mistbell-v3/**"
      - ".github/workflows/v3-detekt-baseline.yml"

permissions:
  contents: read

jobs:
  generate-baseline:
    name: Generate and upload Detekt baseline
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout PR source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate baseline from current 3.0 source
        working-directory: mistbell-v3
        run: |
          chmod +x ./gradlew
          ./gradlew :app:detektBaseline --no-daemon --stacktrace

      - name: Upload generated baseline for review
        uses: actions/upload-artifact@v4
        with:
          name: mistbell-v3-detekt-baseline
          path: mistbell-v3/config/detekt/baseline.xml
          if-no-files-found: error
          retention-days: 7
